<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeRoute</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="navbar">
  <div class="logo">🛡️ SafeRoute</div>
</header>

<section id="home" class="hero">
  <h1>Predictive Safety Routing for Cities</h1>
  <p>Know how safe your route will feel — before you go.</p>
</section>

<!-- 🔥 DEMO SECTION (UPDATED) -->
<section id="demo" class="demo">

  <h2>Try SafeRoute</h2>

  <div class="search-bar">
    <input id="origin" value="UW Bothell" />
    <input id="destination" value="Seattle Downtown" />

    <select id="mode">
      <option>Safer</option>
      <option>Balanced</option>
      <option>Fastest</option>
    </select>

    <button onclick="analyzeRoutes(false)">Analyze Route</button>
  </div>

  <div class="main-layout">

    <div id="map"></div>

    <div class="routes-panel">
      <div class="panel-top">
        <h3>Recommended Routes</h3>
        <button onclick="analyzeRoutes(true)" class="simulate-btn">
          Simulate 30 Min Later
        </button>
      </div>

      <div id="routesList"></div>
    </div>

  </div>

  <div id="agentBox" class="agent-box"></div>

</section>

<script src="script.js"></script>

<!-- 🔑 ADD YOUR GOOGLE MAPS KEY HERE -->
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>

</body>
</html>
