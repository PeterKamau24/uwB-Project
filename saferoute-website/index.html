<!DOCTYPE html>
<html>
<head>
  <title>SafeRoute</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">🛡️ SafeRoute</div>
  <nav>
    <a>Home</a>
    <a class="active">Live Demo</a>
    <a>How It Works</a>
  </nav>
  <button class="demo-btn">Try Live Demo</button>
</header>

<section class="demo">

  <h2>Try SafeRoute</h2>

  <div class="search-bar">
    <input placeholder="UW Bothell">
    <input placeholder="Seattle Downtown">

    <select>
      <option>Safer</option>
      <option>Balanced</option>
    </select>

    <button onclick="loadRoutes(false)">Analyze Route</button>
  </div>

  <div class="main-layout">

    <!-- MAP -->
    <div class="map-container">
      <img src="assets/map.png" class="map-img">

      <!-- fake route lines -->
      <div class="route green"></div>
      <div class="route yellow"></div>
      <div class="route red"></div>
    </div>

    <!-- SIDE PANEL -->
    <div class="panel">

      <div class="panel-header">
        <h3>Recommended Routes</h3>
        <button onclick="loadRoutes(true)" class="simulate">
          Simulate 30 Min Later
        </button>
      </div>

      <div id="routes"></div>

    </div>

  </div>

  <div id="agent" class="agent"></div>

</section>

<script src="script.js"></script>
</body>
</html>
